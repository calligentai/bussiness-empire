# Render @@ placeholders with the immutable release path, revision and Tailscale IP.
services:
  lavabean:
    image: lavabean-staging:@@REVISION@@
    build:
      context: @@SOURCE_DIR@@
      dockerfile: deploy/staging/Dockerfile
      args:
        APP_REVISION: @@REVISION@@
    pull_policy: never
    restart: unless-stopped
    ports:
      - "@@BIND_IP@@:18081:3000"
    environment:
      NODE_ENV: production
      APP_ENV: staging
      APP_REVISION: @@REVISION@@
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
