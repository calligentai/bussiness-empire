# Coolify service ywwvl15ktujn5pydtfrug0mb.
# Bind stays on 100.111.84.46:18082. Do not retarget port 18081.
# pull_policy never: load the image built on the iMac, do not pull it.
services:
  lavabean:
    image: lavabean-staging:@@REVISION@@
    pull_policy: never
    restart: unless-stopped
    ports:
      - "100.111.84.46:18082:3000"
    environment:
      NODE_ENV: production
      APP_ENV: staging
      APP_REVISION: @@REVISION@@
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "3000"
      PAYMENT_PROVIDER: manual
      ORDER_DATA_DIR: /data/orders
    volumes:
      - lavabean-18082-orders:/data/orders
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  lavabean-18082-orders:
