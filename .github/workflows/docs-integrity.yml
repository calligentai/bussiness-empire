name: docs-integrity
on:
  push:
    branches: [main, lavabean, 'feature/**']
  pull_request:
    branches: [main, lavabean]
permissions:
  contents: read
concurrency:
  group: docs-integrity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify imported source documents
        run: sha256sum -c docs/sources/SHA256SUMS
