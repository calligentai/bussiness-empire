name: paperclip-checks
on:
  push:
    branches: ['feature/paperclip-orchestrator']
  pull_request:
    branches: [lavabean, 'feature/dev-workflow']
permissions:
  contents: read
concurrency:
  group: paperclip-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, resolved 2026-10-21
        with:
          python-version: '3.15.0'
      - name: Configuration regression tests
        run: python -m unittest discover -s tests -v
      - name: Imported source integrity
        run: sha256sum -c docs/sources/SHA256SUMS
